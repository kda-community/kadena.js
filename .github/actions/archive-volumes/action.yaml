name: 'Archive sandbox volume'
inputs:
  test-object:
    description: 'object under test'
    required: true
runs:
  using: 'composite'
  steps:
      - name: Upload Volume
        uses: actions/upload-artifact@v4
        with:
          name: sandbox_volume_${{ inputs.test-object }}
          path: ${{ env.SANDBOX_RUN }}
