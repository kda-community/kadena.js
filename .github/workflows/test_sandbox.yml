#        with:
#          app: tools
#
#      - name: Setup Kadena sandbox
#        uses: ./.github/actions/sandbox
#        with:
#          node_git_ref: fix_devnet
#
#      - name: Run end-to-end tests
#        continue-on-error: true
#        uses: ./.github/actions/end-to-end-tests
#        with:
#          app: tools
#
#      - name: Kill Kadena Sandbox
#        if: always()
#        run: |
#          kill $(cat "$SANDBOX_RUN/pid")
#
#      - name: Archive volumes
#        uses: ./.github/actions/archive-volumes
#        if: always()
#        with:
#          test-object: "tools"
#

      - name: Runner Setup
        uses: ./.github/actions/runner-setup

      - name: Setup Kadena sandbox
        uses: ./.github/actions/sandbox
        with:
          node_git_ref: fix_devnet

      - name: Setup Chainweb data sandbox
        uses: ./.github/actions/sandbox_data_node
        with:
          extra_migration_dir: packages/apps/graph/cwd-extra-migrations

      - name: Build App with NODE_ENV=test
        uses: ./.github/actions/build-app-e2e
        with:
          app: graph

      - name: Start graph
        working-directory: packages/apps/graph
        run: |
          pnpm install --filter @kadena/graph
          pnpm turbo build --filter @kadena/graph
          pnpm run start
