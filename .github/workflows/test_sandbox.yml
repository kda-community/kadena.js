name: Test Sandbox
# All pull requests, and
# Workflow dispatch allows you to run this workflow manually from the Actions tab
on:
  pull_request:
  push:
  workflow_dispatch:

env:
  CI: true
  # comma separated list of allowed authors for docs PRs
  # ALLOWED_DOCS_AUTHORS: lsgunnlsgunn,

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    name: Test Kadena Sandbox New
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Runner Setup
        uses: ./.github/actions/runner-setup

      - name: Setup Kadena sandbox
        uses: ./.github/actions/sandbox
        node_git_ref: fix_devnet

      - name: Build App with NODE_ENV=test
        uses: ./.github/actions/build-app-e2e
        with:
          app: tools

      - name: Run end-to-end tests
        uses: ./.github/actions/end-to-end-tests
        with:
          app: tools

      - name: Kill Kadena Sandbox
        run: |
          kill "$(cat "$SANDBOX_RUN/chainweb-node.pid")"
          kill "$(cat "$SANDBOX_RUN/chainweb-mining-client.pid")"
